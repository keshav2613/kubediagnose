[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kubediagnose"
version = "0.1.0"
description = "Evidence-based Kubernetes workload diagnostics from your terminal"
requires-python = ">=3.11"

dependencies = [
    "kubernetes>=30.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0"
]

[project.scripts]
kubediagnose = "kubediagnose.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
[tool.setuptools.packages.find]
include = ["kubediagnose*"]
exclude = ["tests*", "k8s*", "failure-labs*"]